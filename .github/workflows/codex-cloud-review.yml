# Temporary verification of hosted Codex review status delivery.
name: Codex cloud review status

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    if: >-
      ${{ github.event.issue.pull_request && github.event.sender.id == 199175422 &&
          startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->') }}
    concurrency:
      group: codex-cloud-review-${{ github.event.issue.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish Codex status for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import re
          import os
          import urllib.request


          BOT_ID = 199175422
          APP_ID = 1144995
          SUMMARY = "<!-- codex-pull-request-review-summary -->"
          STATE = re.compile(r"<!-- codex-review-state:v1 (.+) -->")
          CODE_REVIEW_ROW = re.compile(r"\| 📝 \*\*Code Review\*\* \| [^|]* \| `([0-9a-f]{7,40})` \| ([^|]+) \|")


          def decision(comment, sender_id, head_sha):
              if (
                  sender_id != BOT_ID
                  or (comment.get("user") or {}).get("id") != BOT_ID
                  or (comment.get("performed_via_github_app") or {}).get("id") != APP_ID
              ):
                  return None

              lines = (comment.get("body") or "").splitlines()
              if not lines or lines[0] != SUMMARY:
                  return None
              state = STATE.fullmatch(lines[1]) if len(lines) > 1 else None
              if state is None:
                  return "error"
              try:
                  review = json.loads(state[1])["code_review"]
                  sha = review["commit_sha"]
                  status = review["status"]
              except (ValueError, TypeError, KeyError):
                  return "error"

              if sha != head_sha:
                  return None
              rows = [row for line in lines[2:] if (row := CODE_REVIEW_ROW.fullmatch(line))]
              if len(rows) != 1 or not head_sha.startswith(rows[0][1]):
                  return "error"
              trigger = rows[0][2]
              if trigger == "Manual request":
                  return None
              if trigger not in {"PR opened", "New commits", "Draft marked ready"}:
                  print(f"Unrecognized Codex review trigger: {trigger!r}")
                  return "error"
              if status == "running":
                  return "pending"
              if status != "completed":
                  return "error"

              if review.get("has_any_findings") is True:
                  return "failure"
              if review.get("has_any_findings") is False and review.get("has_unresolved_findings") is False:
                  return "success"
              return "error"


          CONTEXTS = {
              "main": "Codex Cloud Review",
          }

          DESCRIPTIONS = {
              "pending": "Codex is reviewing this commit",
              "success": "Codex completed review with no findings",
              "failure": "Codex completed review with findings",
              "error": "Codex did not return a usable review result",
          }


          def github(path, data=None):
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)


          def main():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file)
              sender_id = event["sender"]["id"]
              if sender_id != BOT_ID or "pull_request" not in event["issue"]:
                  return

              pr = github(f"pulls/{int(event['issue']['number'])}")
              context = CONTEXTS.get(pr["base"]["ref"])
              if context is None or pr["state"] != "open" or pr["draft"]:
                  return

              comment = github(f"issues/comments/{int(event['comment']['id'])}")
              if any(comment[key] != event["comment"][key] for key in ("body", "updated_at")):
                  print("Ignoring a superseded comment event")
                  return

              head_sha = pr["head"]["sha"]
              result = decision(comment, sender_id, head_sha)
              if result is None:
                  return

              github(
                  f"statuses/{head_sha}",
                  {
                      "context": context,
                      "state": result,
                      "description": DESCRIPTIONS[result],
                      "target_url": comment["html_url"],
                  },
              )
              print(f"{context} for {head_sha} is {result}")


          if __name__ == "__main__":
              main()
          PY
