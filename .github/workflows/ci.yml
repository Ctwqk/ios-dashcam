name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --reporter github-actions-logging

  core-tests:
    name: DashCamCore unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test (macOS host)
        run: make test-core
      - name: xcodebuild test (iOS Simulator)
        run: |
          set -o pipefail
          make test-core-ios | tee test-ios.log | grep -E "Test Suite 'All tests'|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test-ios.log

  app:
    name: Build app for iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (iOS Simulator, no code signing)
        run: |
          set -o pipefail
          make build | tee build.log | tail -5
      - name: Compiler warnings
        if: always()
        run: grep -E "warning:" build.log | sort -u | head -60 || true
      - name: App adapter tests (iOS Simulator)
        run: |
          set -o pipefail
          make test-app-ios | tee test-app.log | tail -30
      - name: Launch in simulator and capture screenshots
        run: scripts/capture-screenshots.sh build/DerivedData build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn
