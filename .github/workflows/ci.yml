name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: DashCamCore unit tests (macOS host)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        working-directory: dashcam/DashCamCore
        run: swift test --parallel

  app:
    name: Build app for iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project dashcam/DashCam.xcodeproj \
            -scheme DashCam \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | tail -5
      - name: Compiler warnings
        if: always()
        run: grep -E "warning:" build.log | sort -u | head -60 || true
